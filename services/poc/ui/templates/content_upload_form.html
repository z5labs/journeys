<div class="modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;">
    <div style="background: white; padding: 2rem; border-radius: 8px; max-width: 500px; width: 90%;">
        <form hx-post="/app/journey/{{.JourneyID}}/content"
              hx-encoding="multipart/form-data"
              hx-target="#content-gallery"
              hx-swap="beforeend">
            
            <h2>Add Content</h2>
            
            <div style="margin: 1rem 0;">
                <label style="margin-right: 1rem;">
                    <input type="radio" name="type" value="photo" checked> Photo
                </label>
                <label>
                    <input type="radio" name="type" value="video"> Video
                </label>
            </div>
            
            <div style="margin: 1rem 0;">
                <label for="files">Files:</label>
                <input type="file" 
                       id="files"
                       name="files" 
                       multiple 
                       accept="image/*,video/*"
                       required
                       style="display: block; margin-top: 0.5rem;">
            </div>
            
            <div style="margin: 1rem 0;">
                <label for="title">Title (optional):</label>
                <input type="text" 
                       id="title"
                       name="title" 
                       placeholder="Title"
                       style="width: 100%; padding: 0.5rem; margin-top: 0.5rem;">
            </div>
            
            <div style="margin: 1rem 0;">
                <label for="description">Description (optional):</label>
                <textarea id="description"
                          name="description" 
                          placeholder="Description"
                          rows="4"
                          style="width: 100%; padding: 0.5rem; margin-top: 0.5rem;"></textarea>
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" style="flex: 1; padding: 0.75rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
                    Upload
                </button>
                <button type="button" 
                        hx-get="/app/journey/{{.JourneyID}}"
                        hx-target="body"
                        hx-swap="innerHTML"
                        style="flex: 1; padding: 0.75rem; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">
                    Cancel
                </button>
            </div>
            
            <div class="htmx-indicator" style="margin-top: 1rem; text-align: center; display: none;">
                Uploading...
            </div>
        </form>
    </div>
</div>
