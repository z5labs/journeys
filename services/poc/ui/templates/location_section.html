{{if and .Latitude .Longitude}}
<div class="geo-info" style="padding: 1rem; background: #f5f5f5; border-radius: 8px;">
    <p style="margin: 0.5rem 0; font-size: 1rem;">
        📍 {{printf "%.6f" (deref .Latitude)}}, {{printf "%.6f" (deref .Longitude)}}
        {{if .Altitude}}({{printf "%.1f" (deref .Altitude)}}m){{end}}
    </p>
    {{if .LocationName}}
    <p style="margin: 0.5rem 0; font-size: 0.875rem; color: #666;">{{.LocationName}}</p>
    {{end}}
    <div style="display: flex; gap: 0.75rem; margin-top: 0.75rem;">
        <a href="https://www.google.com/maps?q={{deref .Latitude}},{{deref .Longitude}}"
           target="_blank"
           style="padding: 0.5rem 1rem; background: #4285f4; color: white; text-decoration: none; border-radius: 4px; font-size: 0.875rem;">
            View on Google Maps
        </a>
        <button hx-get="/app/content/{{.ID}}/location/form"
                hx-target="#location-form-modal"
                hx-swap="innerHTML"
                style="padding: 0.5rem 1rem; background: #ffc107; color: #000; border: none; border-radius: 4px; cursor: pointer; font-size: 0.875rem; font-weight: 500;">
            ✏️ Edit Location
        </button>
    </div>
</div>
{{else}}
<div style="padding: 1rem; background: #f5f5f5; border-radius: 8px; text-align: center;">
    <p style="margin: 0 0 1rem 0; color: #666;">No location set for this content.</p>
    <button hx-get="/app/content/{{.ID}}/location/form"
            hx-target="#location-form-modal"
            hx-swap="innerHTML"
            style="padding: 0.75rem 1.5rem; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: 500;">
        📍 Add Location
    </button>
</div>
{{end}}
