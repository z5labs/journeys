<div class="modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: white; padding: 2rem; border-radius: 8px; max-width: 500px; width: 90%;">
        <form hx-put="/app/content/{{.ContentID}}/location"
              hx-target="[data-content-id='{{.ContentID}}']"
              hx-swap="outerHTML">

            <h2>Edit Location</h2>
            <p style="margin: 0.5rem 0; font-size: 0.875rem; color: #666;">
                Update geolocation information for this content. Leave fields empty to remove location data.
            </p>

            <div style="margin: 1rem 0;">
                <label for="latitude">Latitude <span style="color: #dc3545;">*</span></label>
                <input type="number"
                       id="latitude"
                       name="latitude"
                       step="0.000001"
                       min="-90"
                       max="90"
                       placeholder="e.g., 40.712776"
                       {{if .Latitude}}value="{{.Latitude}}"{{end}}
                       style="width: 100%; padding: 0.5rem; margin-top: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
                <small style="font-size: 0.75rem; color: #666;">Valid range: -90 to 90</small>
            </div>

            <div style="margin: 1rem 0;">
                <label for="longitude">Longitude <span style="color: #dc3545;">*</span></label>
                <input type="number"
                       id="longitude"
                       name="longitude"
                       step="0.000001"
                       min="-180"
                       max="180"
                       placeholder="e.g., -74.005974"
                       {{if .Longitude}}value="{{.Longitude}}"{{end}}
                       style="width: 100%; padding: 0.5rem; margin-top: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
                <small style="font-size: 0.75rem; color: #666;">Valid range: -180 to 180</small>
            </div>

            <div style="margin: 1rem 0;">
                <label for="altitude">Altitude (meters, optional)</label>
                <input type="number"
                       id="altitude"
                       name="altitude"
                       step="0.1"
                       placeholder="e.g., 100.5"
                       {{if .Altitude}}value="{{.Altitude}}"{{end}}
                       style="width: 100%; padding: 0.5rem; margin-top: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" style="flex: 1; padding: 0.75rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500;">
                    Save Location
                </button>
                <button type="button"
                        onclick="document.getElementById('location-form-modal').innerHTML = ''"
                        style="flex: 1; padding: 0.75rem; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500;">
                    Cancel
                </button>
            </div>

            <div style="margin-top: 1rem; padding: 0.75rem; background: #f8f9fa; border-radius: 4px; font-size: 0.875rem;">
                <strong>Tip:</strong> Clear both latitude and longitude to remove location data entirely.
            </div>
        </form>
    </div>
</div>
